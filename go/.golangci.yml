version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors are reported by errcheck
        - G304 # file paths come from the caller's configuration on purpose
        - G402 # InsecureSkipVerify is an explicit, documented test-only option
        - G404 # math/rand is only used for retry jitter
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
        - name: var-naming
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - unparam
          - bodyclose
          - errorlint

formatters:
  enable:
    - gofmt
