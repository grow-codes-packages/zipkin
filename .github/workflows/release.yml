# Generated by sdk-kit 0.3.0 — do not edit; change sdk-kit and run "sdk-kit sync"
#
# Release for the Zipkin SDK. release-please keeps one release PR for the five packages;
# merging it tags the released packages and publishes them (reusable workflow in sdk-kit):
# npm (@grow-codes/zipkin), crates.io (grow-zipkin), Go (tag go/vX.Y.Z), Maven Central
# (codes.grow.packages:zipkin) and — in the `pypi` job below — PyPI (grow-zipkin).
#
# Registry setup (owner). Until a registry is configured its job ends green with a notice.
#   npm        trusted publisher: repo grow-codes-packages/zipkin, workflow release.yml,
#              then set repository variable NPM_TRUSTED_PUBLISHING=true (or add secret NPM_TOKEN)
#   crates.io  trusted publisher: repo grow-codes-packages/zipkin, workflow release.yml,
#              then set CRATES_TRUSTED_PUBLISHING=true (or add secret CARGO_REGISTRY_TOKEN)
#   PyPI       secret PYPI_API_TOKEN (first releases), or trusted publisher: repo grow-codes-packages/zipkin, workflow release.yml,
#              environment pypi, then set PYPI_TRUSTED_PUBLISHING=true
#   Maven      secrets MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD (Central Portal user
#              token), MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE
#   Go         nothing: the go/vX.Y.Z tag is the release; proxy.golang.org is warmed up
# TODO(sdk-kit): pin @main to @v0 once sdk-kit v0.1.0 is released.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: grow-codes-packages/sdk-kit/.github/workflows/release-packages.yml@main
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      npm-trusted-publishing: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' }}
      crates-trusted-publishing: ${{ vars.CRATES_TRUSTED_PUBLISHING == 'true' }}
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  # Only when `release` failed (for example its Maven job): GitHub does not document that the
  # outputs of a reusable workflow whose run failed reach the caller, so look for the
  # `python-dist` artifact of this run instead. On a green `release` this job is skipped.
  pypi-dist:
    name: find Python distributions
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # list this run's artifacts
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - name: Look for the python-dist artifact
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=python-dist" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "${count:-0}" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=PyPI publish::another publish job failed; python-dist exists, so PyPI still publishes"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  # PyPI trusted publishing only accepts a top-level workflow, so this job lives here and not in
  # the reusable workflow. It uploads the `python-dist` artifact built by `release`, and it runs
  # even when another publish job of `release` failed (a Maven Central failure must not hold
  # back PyPI).
  pypi:
    name: publish PyPI
    needs: [release, pypi-dist]
    if: ${{ !cancelled() && (needs.release.outputs.python-release-created == 'true' || needs.pypi-dist.outputs.found == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/grow-zipkin/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - name: Check PyPI trust
        id: gate
        env:
          TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          if [ "$TRUSTED" = "true" ] || [ "$HAS_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=PyPI publish skipped::Add this repo's release.yml (environment pypi) as trusted publisher of grow-zipkin on pypi.org and set the variable PYPI_TRUSTED_PUBLISHING=true, or add the secret PYPI_API_TOKEN, then re-run this job."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download distributions
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        if: steps.gate.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # A re-run after a partial failure must not fail on files that are already on PyPI.
          skip-existing: true
          # Empty when unset: the action then uses trusted publishing (OIDC).
          password: ${{ secrets.PYPI_API_TOKEN }}
