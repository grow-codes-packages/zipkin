# Generated by sdk-kit 0.1.0 — do not edit; change sdk-kit and run "sdk-kit sync"
#
# CI for the Zipkin SDK: the five language pipelines, the Docker integration suite against
# the real service, `sdk-kit check` and the documentation site (deployed to GitHub Pages from
# main). The jobs live in reusable workflows of grow-codes-packages/sdk-kit.
# TODO(sdk-kit): pin @main to @v0 once sdk-kit v0.1.0 is released.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    uses: grow-codes-packages/sdk-kit/.github/workflows/lang-typescript.yml@main
  rust:
    uses: grow-codes-packages/sdk-kit/.github/workflows/lang-rust.yml@main
  go:
    uses: grow-codes-packages/sdk-kit/.github/workflows/lang-go.yml@main
  python:
    uses: grow-codes-packages/sdk-kit/.github/workflows/lang-python.yml@main
  java:
    uses: grow-codes-packages/sdk-kit/.github/workflows/lang-java.yml@main

  docker:
    name: docker
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, rust, go, python, java]
    uses: grow-codes-packages/sdk-kit/.github/workflows/docker-integration.yml@main
    with:
      lang: ${{ matrix.lang }}

  check:
    uses: grow-codes-packages/sdk-kit/.github/workflows/sdk-kit-check.yml@main
    with:
      sdk-kit-ref: main

  docs:
    needs: [typescript, rust, go, python, java]
    uses: grow-codes-packages/sdk-kit/.github/workflows/docs.yml@main
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
