# Generated by sdk-kit 0.1.0 — do not edit; change sdk-kit and run "sdk-kit sync"
name: Bug report
description: Something in the Zipkin SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Never paste real credentials, tokens or secret values — use
        placeholders. Security problems go to opensource@grow.codes (see SECURITY.md).
  - type: dropdown
    id: language
    attributes:
      label: Language
      multiple: true
      options: [TypeScript, Rust, Go, Python, Java]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: service-version
    attributes:
      label: Zipkin version / deployment
      placeholder: "openzipkin/zipkin:3.6.1 (self-hosted) / managed service"
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: "Node 24 / rustc 1.91 / Go 1.26 / Python 3.13 / Java 21 on Linux"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Code and configuration (redact secrets). Error code and message if any.
      render: text
    validations:
      required: true
