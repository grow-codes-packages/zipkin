# Created by sdk-kit 0.1.0; owned by this repository.
# Consumer crate: uses the packaged crate like a user would (Docker replaces `..` with the
# unpacked `.crate`), runs the integration tests and the conformance runner.
[package]
name = "grow-zipkin-integration"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
grow-zipkin = { path = "..", features = ["testing", "blocking"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1.0.120"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }

[workspace]
