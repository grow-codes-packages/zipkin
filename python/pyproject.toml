[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "grow-zipkin"
dynamic = ["version"]
description = "Grow Codes SDK for Zipkin (unofficial, community maintained)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Grow Codes", email = "opensource@grow.codes" }]
maintainers = [{ name = "Grow Codes", email = "opensource@grow.codes" }]
keywords = ["grow-codes", "sdk", "zipkin", "tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  # B3 is part of the Zipkin preset's default propagators (tracecontext, baggage, b3).
  "opentelemetry-propagator-b3>=1.27,<2",
]

[project.optional-dependencies]
grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.27,<2"]
requests = ["requests>=2.31,<3"]
b3 = ["opentelemetry-propagator-b3>=1.27,<2"]
asgi = []
# Every optional runtime extra (used by `make license`).
all = [
  "grow-zipkin[grpc,requests,b3]",
]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-licenses>=5.0",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
  "requests>=2.31,<3",
  "types-requests>=2.31",
  "opentelemetry-propagator-b3>=1.27,<2",
]

[project.urls]
Homepage = "https://grow-codes-packages.github.io/zipkin/"
Documentation = "https://grow-codes-packages.github.io/zipkin/"
Repository = "https://github.com/grow-codes-packages/zipkin"
Issues = "https://github.com/grow-codes-packages/zipkin/issues"

[tool.hatch.version]
path = "src/grow_zipkin/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/grow_zipkin"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "tools"]
extend-exclude = ["integration/.venv", "build", "dist", "site"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "S", "A", "C4", "SIM", "RET", "PT", "RUF", "N", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603",
  "S101",    # assert is fine in tests and type narrowing
  "S311",    # random is used for jitter, not crypto
  "RUF022",  # __all__ grouped by topic, not sorted
  "A004",    # the SDK's TimeoutError intentionally shadows the builtin (SPEC 2.1)
  "PLE1205", # SdkLogger.debug(msg, fields) is not a stdlib logging call
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415", "N802", "B017", "PT011", "PT018", "N815", "RUF001", "RUF012", "SIM117"]
"tools/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src/grow_zipkin", "tools"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["grow_zipkin"]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "\\.\\.\\.$",
]
