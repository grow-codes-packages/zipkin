# API reference of the Python package only (`make docs`). The full documentation site lives in the
# repository root (mkdocs.yml + docs/), which renders the same docstrings with mkdocstrings.
site_name: grow-zipkin Python API
docs_dir: docs
site_dir: site
theme:
  name: mkdocs
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
